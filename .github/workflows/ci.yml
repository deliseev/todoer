# Прогон тестов на main: те же проверки, что и локально перед сдачей работы.
# Расходиться им нельзя — иначе зелёная сборка перестаёт что-либо значить.
name: CI

on:
  push:
    branches: [main]
  # Ветка проверяется до вливания, а не после: сломанный main чинить дороже.
  pull_request:
    branches: [main]

# Новый пуш отменяет прогон предыдущего: гонять устаревший коммит незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Адрес базы один и тот же для приложения и для тестов, но переменные
      # разные: тесты создают и удаляют базы целиком, и подставить им рабочую
      # базу по ошибке не должно быть возможно одной опечаткой.
      TODOER_DATABASE_URL: postgres://todoer:todoer@localhost:5432/todoer?sslmode=disable
      TODOER_TEST_DATABASE_URL: postgres://todoer:todoer@localhost:5432/todoer?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версия берётся из go.mod, чтобы не держать её в двух местах.
          go-version-file: go.mod

      - name: gofmt -s
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "нужен gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # База поднимается тем же файлом, что и на машине разработчика: второе
      # описание базы рядом с первым разошлось бы с ним так же незаметно, как
      # разошлись бы два списка проверок. --wait ждёт healthcheck, иначе первый
      # же тест упрётся в ещё не поднявшийся Postgres.
      - name: docker compose up
        run: docker compose up -d --wait db

      # Отдельным шагом, а не через оснастку тестов: схему в бою двигает
      # выкатка, и этот путь обязан проверяться сам по себе.
      - name: миграции
        run: go run ./cmd/todoer-migrate up

      # -race и -count=1 обязательны: гонки этот код уже ловил, а кэш тестов
      # в CI превратил бы прогон в проверку того, что ничего не изменилось.
      # TODOER_TEST_DATABASE_URL выставлена, поэтому интеграционные тесты здесь
      # не пропускаются, а падают, если базы не окажется: зелёная сборка,
      # ничего не проверившая, хуже красной.
      - name: go test -race
        run: go test ./... -race -count=1
